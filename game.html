<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Knotty Blocks</title>
<style>
  :root{
    --bark-900:#2b1d14;
    --bark-800:#3a2818;
    --bark-700:#4a331f;
    --panel:#5c4128;
    --panel-light:#6e4f30;
    --cell-empty:#3d2b1a;
    --cell-border:#2a1c11;
    --ink:#f3e6d0;
    --ink-dim:#c9b596;
    --accent:#e0a458;
    --good:#7fbf6a;
    --bad:#c0564a;
    --oak-1:#d9a066; --oak-2:#c98a4f;
    --walnut-1:#8a5a34; --walnut-2:#6f4526;
    --mahogany-1:#a3432f; --mahogany-2:#832f1f;
    --cherry-1:#b5583f; --cherry-2:#8f3f2a;
    --pine-1:#c2a06a; --pine-2:#a3824f;
    --stone-1:#9098a0; --stone-2:#5c6570;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none;}
  html,body{
    margin:0; padding:0; height:100%; overflow:hidden;
    background:
      radial-gradient(ellipse at 50% -10%, var(--bark-700), var(--bark-900) 70%);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    color:var(--ink);
    touch-action:none;
  }
  #app{
    position:relative; width:100%; height:100%;
    display:flex; flex-direction:column; align-items:center;
    padding:env(safe-area-inset-top,10px) 12px env(safe-area-inset-bottom,10px);
    max-width:520px; margin:0 auto;
  }
  header{
    width:100%; display:flex; align-items:center; justify-content:space-between;
    padding:6px 4px 10px;
  }
  .brand{display:flex; align-items:center; gap:8px;}
  .brand-badge{
    width:34px;height:34px;border-radius:9px;
    background:linear-gradient(145deg,var(--oak-1),var(--oak-2));
    box-shadow: inset 0 -3px 0 rgba(0,0,0,.25), inset 0 2px 0 rgba(255,255,255,.25);
    display:flex;align-items:center;justify-content:center;font-size:18px;
  }
  .brand-name{font-weight:800; font-size:19px; letter-spacing:.3px;}
  .brand-name small{display:block; font-weight:500; font-size:10px; color:var(--ink-dim); letter-spacing:1px; text-transform:uppercase;}
  .scores{display:flex; gap:10px;}
  .score-box{
    background:var(--panel); border-radius:10px; padding:6px 12px; min-width:64px; text-align:center;
    box-shadow: inset 0 -2px 0 rgba(0,0,0,.3), inset 0 1px 0 rgba(255,255,255,.08);
  }
  .score-box .label{font-size:9px; text-transform:uppercase; letter-spacing:1px; color:var(--ink-dim);}
  .score-box .value{font-size:18px; font-weight:800; color:var(--accent); line-height:1.3;}

  #banner{
    width:100%; text-align:center; font-size:12px; color:var(--ink-dim);
    min-height:16px; margin-bottom:4px;
  }

  #board-wrap{
    position:relative; width:100%; aspect-ratio:1/1; max-width:420px;
    background:var(--panel);
    border-radius:14px; padding:8px;
    box-shadow: inset 0 -4px 0 rgba(0,0,0,.3), inset 0 3px 0 rgba(255,255,255,.06), 0 10px 24px rgba(0,0,0,.35);
  }
  #board{
    display:grid; grid-template-columns:repeat(8,1fr); grid-template-rows:repeat(8,1fr);
    gap:4px; width:100%; height:100%;
  }
  .cell{
    background:var(--cell-empty);
    border-radius:5px;
    box-shadow:inset 0 2px 3px rgba(0,0,0,.4);
    position:relative;
  }
  .cell.filled{ box-shadow:none; }
  .cell.preview-ok{ box-shadow:0 0 0 2px var(--good) inset; }
  .cell.preview-bad{ box-shadow:0 0 0 2px var(--bad) inset; }
  .cell.clearing{ animation:pop .28s ease forwards; }
  @keyframes pop{
    0%{ transform:scale(1); filter:brightness(1); }
    50%{ transform:scale(1.12); filter:brightness(1.6); }
    100%{ transform:scale(0); filter:brightness(2); opacity:0; }
  }

  .block{
    position:absolute; inset:0; border-radius:5px;
    box-shadow: inset 0 -3px 0 rgba(0,0,0,.32), inset 0 2px 0 rgba(255,255,255,.28), 0 1px 2px rgba(0,0,0,.3);
    background-image:
      repeating-linear-gradient(100deg, rgba(0,0,0,.06) 0px, rgba(0,0,0,.06) 2px, transparent 2px, transparent 7px);
  }
  .wood-oak{ background-color:var(--oak-2); background-image:
      repeating-linear-gradient(100deg, rgba(0,0,0,.08) 0px, rgba(0,0,0,.08) 2px, transparent 2px, transparent 8px),
      linear-gradient(160deg,var(--oak-1),var(--oak-2)); }
  .wood-walnut{ background-color:var(--walnut-2); background-image:
      repeating-linear-gradient(100deg, rgba(0,0,0,.1) 0px, rgba(0,0,0,.1) 2px, transparent 2px, transparent 8px),
      linear-gradient(160deg,var(--walnut-1),var(--walnut-2)); }
  .wood-mahogany{ background-color:var(--mahogany-2); background-image:
      repeating-linear-gradient(100deg, rgba(0,0,0,.1) 0px, rgba(0,0,0,.1) 2px, transparent 2px, transparent 8px),
      linear-gradient(160deg,var(--mahogany-1),var(--mahogany-2)); }
  .wood-cherry{ background-color:var(--cherry-2); background-image:
      repeating-linear-gradient(100deg, rgba(0,0,0,.1) 0px, rgba(0,0,0,.1) 2px, transparent 2px, transparent 8px),
      linear-gradient(160deg,var(--cherry-1),var(--cherry-2)); }
  .wood-pine{ background-color:var(--pine-2); background-image:
      repeating-linear-gradient(100deg, rgba(0,0,0,.08) 0px, rgba(0,0,0,.08) 2px, transparent 2px, transparent 8px),
      linear-gradient(160deg,var(--pine-1),var(--pine-2)); }
  /* Algorithm-placed obstacle tiles for the rising-stack mode -- deliberately
     stone/mossy rather than a wood grain, so it always reads as "not yours". */
  .wood-stone{ background-color:var(--stone-2); background-image:
      repeating-linear-gradient(45deg, rgba(0,0,0,.1) 0 5px, transparent 5px 11px),
      linear-gradient(160deg,var(--stone-1),var(--stone-2)); }

  #tray{
    width:100%; max-width:420px; display:flex; justify-content:space-between;
    align-items:center; margin-top:16px; height:110px; gap:8px;
  }
  .piece-slot{
    flex:1; height:100%; border-radius:12px; position:relative;
    background:rgba(0,0,0,.15);
    box-shadow:inset 0 2px 4px rgba(0,0,0,.35);
  }
  .piece{
    position:absolute; touch-action:none; cursor:grab; z-index:20;
    display:grid; gap:3px;
  }
  .piece .pc{ border-radius:4px; }
  .piece.dragging{ z-index:1000; opacity:.95; filter:drop-shadow(0 10px 14px rgba(0,0,0,.5)); }
  .piece.disabled{ opacity:.35; filter:grayscale(.6); }

  #combo-flash{
    position:absolute; top:38%; left:50%; transform:translate(-50%,-50%) scale(.6);
    font-size:34px; font-weight:900; color:var(--accent);
    text-shadow:0 3px 0 rgba(0,0,0,.4); opacity:0; pointer-events:none; z-index:500;
    letter-spacing:1px;
  }
  #combo-flash.show{ animation:flash .7s ease; }
  @keyframes flash{
    0%{opacity:0; transform:translate(-50%,-50%) scale(.5);}
    25%{opacity:1; transform:translate(-50%,-50%) scale(1.1);}
    70%{opacity:1; transform:translate(-50%,-50%) scale(1);}
    100%{opacity:0; transform:translate(-50%,-50%) scale(1) translateY(-30px);}
  }

  #overlay{
    position:absolute; inset:0; background:rgba(20,12,6,.86);
    display:none; align-items:center; justify-content:center; z-index:900;
    flex-direction:column; text-align:center; padding:24px;
  }
  #overlay.show{ display:flex; }
  #overlay h1{ font-size:26px; margin:0 0 6px; }
  #overlay p{ color:var(--ink-dim); margin:0 0 18px; }
  #overlay .final-score{ font-size:46px; font-weight:900; color:var(--accent); margin-bottom:4px;}
  button.primary{
    background:linear-gradient(160deg,var(--oak-1),var(--oak-2));
    border:none; color:#2b1d14; font-weight:800; font-size:16px;
    padding:12px 28px; border-radius:12px; cursor:pointer;
    box-shadow: inset 0 -3px 0 rgba(0,0,0,.25), inset 0 2px 0 rgba(255,255,255,.35), 0 6px 14px rgba(0,0,0,.35);
  }
  #toast{
    position:fixed; left:50%; bottom:18px; transform:translateX(-50%) translateY(120%);
    background:var(--panel-light); color:var(--ink); padding:10px 16px; border-radius:10px;
    font-size:13px; box-shadow:0 6px 16px rgba(0,0,0,.4); z-index:2000; max-width:88%;
    display:flex; align-items:center; gap:10px; transition:transform .3s ease;
  }
  #toast.show{ transform:translateX(-50%) translateY(0); }
  #toast button{
    background:var(--accent); border:none; color:#2b1d14; font-weight:700;
    padding:5px 10px; border-radius:7px; font-size:12px; cursor:pointer;
  }
  #version-tag{ position:fixed; right:8px; bottom:6px; font-size:9px; color:rgba(255,255,255,.25); z-index:1; }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand">
      <div class="brand-badge">🪵</div>
      <div class="brand-name">Knotty Blocks<small id="tagline">Wood Block Puzzle</small></div>
    </div>
    <div class="scores">
      <div class="score-box"><div class="label">Score</div><div class="value" id="score">0</div></div>
      <div class="score-box"><div class="label">Best</div><div class="value" id="best">0</div></div>
      <div class="score-box"><div class="label">Rise In</div><div class="value" id="rise-in">5</div></div>
    </div>
  </header>

  <div id="banner"></div>

  <div id="board-wrap">
    <div id="board"></div>
    <div id="combo-flash"></div>
    <div id="overlay">
      <h1 id="overlay-title">Board's Full!</h1>
      <p id="overlay-msg">No more moves left this round.</p>
      <div class="final-score" id="final-score">0</div>
      <button class="primary" id="restart-btn">Play Again</button>
    </div>
  </div>

  <div id="tray">
    <div class="piece-slot" data-slot="0"></div>
    <div class="piece-slot" data-slot="1"></div>
    <div class="piece-slot" data-slot="2"></div>
  </div>
</div>

<div id="toast"><span id="toast-msg"></span><button id="toast-action" style="display:none;"></button></div>
<div id="version-tag">v<span id="version-num"></span></div>

<script>
(function(){
  "use strict";

  // ---------- Embedded version (bumped by hand or by the hotfix pipeline) ----------
  var EMBEDDED_VERSION = "1.1.0";
  document.getElementById("version-num").textContent = EMBEDDED_VERSION;

  // ---------- Config (overridable live via applyRemoteConfig / postMessage) ----------
  var CONFIG = {
    boardSize: 8,
    bannerText: "",
    comboBaseBonus: 10,
    shapeWeights: {}, // shapeId -> relative weight override
    enableComboFlash: true,
    // ---- Rising-stack endless mode ----
    // Every `garbageEveryMoves` successful placements, a new partly-filled
    // "obstacle" row (algorithm-placed, not the player's) is pushed in from
    // the bottom and everything already on the board shifts up one row --
    // like Tetris garbage. If there's no room left at the top to shift into,
    // the stack has "reached the top" and it's game over. This is what makes
    // the game endless in the sense the player asked for: you're never just
    // filling an empty grid, you're continually reacting to a foundation
    // that keeps rising whether you like it or not.
    enableRisingBoard: true,
    garbageEveryMoves: 5,
    garbageFillDensity: 0.6,   // ~60% of cells in a new obstacle row are filled
    garbageMinGaps: 2          // but always leave at least this many open
  };

  // ---------- Shapes: classic generic polyomino set (monomino..pentomino), original layout ----------
  // Each shape is a list of [row, col] offsets from its own top-left bounding box.
  var SHAPES = [
    { id:"1x1", cells:[[0,0]], w:6, wood:"oak" },
    { id:"1x2", cells:[[0,0],[0,1]], w:8, wood:"pine" },
    { id:"2x1", cells:[[0,0],[1,0]], w:8, wood:"pine" },
    { id:"1x3", cells:[[0,0],[0,1],[0,2]], w:9, wood:"walnut" },
    { id:"3x1", cells:[[0,0],[1,0],[2,0]], w:9, wood:"walnut" },
    { id:"1x4", cells:[[0,0],[0,1],[0,2],[0,3]], w:6, wood:"mahogany" },
    { id:"4x1", cells:[[0,0],[1,0],[2,0],[3,0]], w:6, wood:"mahogany" },
    { id:"sq2", cells:[[0,0],[0,1],[1,0],[1,1]], w:9, wood:"cherry" },
    { id:"sq3", cells:[[0,0],[0,1],[0,2],[1,0],[1,1],[1,2],[2,0],[2,1],[2,2]], w:3, wood:"cherry" },
    { id:"L1", cells:[[0,0],[1,0],[2,0],[2,1]], w:8, wood:"oak" },
    { id:"L2", cells:[[0,0],[0,1],[1,0],[2,0]], w:8, wood:"oak" },
    { id:"L3", cells:[[0,1],[1,1],[2,0],[2,1]], w:8, wood:"oak" },
    { id:"L4", cells:[[0,0],[0,1],[1,1],[2,1]], w:8, wood:"oak" },
    { id:"T", cells:[[0,0],[0,1],[0,2],[1,1]], w:7, wood:"pine" },
    { id:"T90", cells:[[0,0],[1,0],[2,0],[1,1]], w:7, wood:"pine" },
    { id:"S", cells:[[0,1],[0,2],[1,0],[1,1]], w:6, wood:"walnut" },
    { id:"Z", cells:[[0,0],[0,1],[1,1],[1,2]], w:6, wood:"walnut" },
    { id:"corner", cells:[[0,0],[0,1],[1,0]], w:9, wood:"mahogany" }
  ];

  function normalize(cells){
    var minR = Math.min.apply(null, cells.map(function(c){return c[0];}));
    var minC = Math.min.apply(null, cells.map(function(c){return c[1];}));
    return cells.map(function(c){ return [c[0]-minR, c[1]-minC]; });
  }
  SHAPES.forEach(function(s){ s.cells = normalize(s.cells); });

  // ---------- State ----------
  var SIZE = CONFIG.boardSize;
  var board = []; // SIZE x SIZE, null or wood class name
  var score = 0;
  var best = 0;
  var combo = 0;
  var tray = [null, null, null];
  var gameOver = false;
  var movesSinceGarbage = 0;

  var boardEl = document.getElementById("board");
  var scoreEl = document.getElementById("score");
  var bestEl = document.getElementById("best");
  var riseInEl = document.getElementById("rise-in");
  var bannerEl = document.getElementById("banner");
  var overlayEl = document.getElementById("overlay");
  var overlayTitleEl = document.getElementById("overlay-title");
  var overlayMsgEl = document.getElementById("overlay-msg");
  var finalScoreEl = document.getElementById("final-score");
  var comboFlashEl = document.getElementById("combo-flash");
  var cellEls = [];

  function loadBest(){
    try { return parseInt(localStorage.getItem("kb_best") || "0", 10) || 0; } catch(e){ return 0; }
  }
  function saveBest(v){
    try { localStorage.setItem("kb_best", String(v)); } catch(e){}
  }

  function buildBoardDOM(){
    boardEl.style.gridTemplateColumns = "repeat(" + SIZE + ",1fr)";
    boardEl.style.gridTemplateRows = "repeat(" + SIZE + ",1fr)";
    boardEl.innerHTML = "";
    cellEls = [];
    for (var r=0;r<SIZE;r++){
      var row = [];
      for (var c=0;c<SIZE;c++){
        var cell = document.createElement("div");
        cell.className = "cell";
        cell.dataset.r = r; cell.dataset.c = c;
        boardEl.appendChild(cell);
        row.push(cell);
      }
      cellEls.push(row);
    }
  }

  function resetBoard(){
    board = [];
    for (var r=0;r<SIZE;r++){
      var row = [];
      for (var c=0;c<SIZE;c++) row.push(null);
      board.push(row);
    }
    buildBoardDOM();
  }

  function weightedRandomShape(){
    var total = 0;
    var entries = SHAPES.map(function(s){
      var w = (CONFIG.shapeWeights && CONFIG.shapeWeights[s.id] != null) ? CONFIG.shapeWeights[s.id] : s.w;
      total += w;
      return { s:s, w:w };
    });
    var r = Math.random() * total;
    for (var i=0;i<entries.length;i++){
      r -= entries[i].w;
      if (r <= 0) return entries[i].s;
    }
    return entries[entries.length-1].s;
  }

  function refillTray(){
    for (var i=0;i<tray.length;i++){
      if (!tray[i]) tray[i] = weightedRandomShape();
    }
    renderTray();
    checkGameOver();
  }

  function canPlace(shape, r0, c0){
    for (var i=0;i<shape.cells.length;i++){
      var r = r0 + shape.cells[i][0];
      var c = c0 + shape.cells[i][1];
      if (r<0||r>=SIZE||c<0||c>=SIZE) return false;
      if (board[r][c]) return false;
    }
    return true;
  }

  function anyPlacement(shape){
    for (var r=0;r<SIZE;r++) for (var c=0;c<SIZE;c++) if (canPlace(shape,r,c)) return true;
    return false;
  }

  function checkGameOver(){
    var alive = tray.some(function(s){ return s && anyPlacement(s); });
    if (!alive){
      triggerGameOver("Board's Full!", "No more moves left this round.");
    }
  }

  function triggerGameOver(title, msg){
    gameOver = true;
    overlayTitleEl.textContent = title;
    overlayMsgEl.textContent = msg;
    finalScoreEl.textContent = score;
    overlayEl.classList.add("show");
  }

  // Pushes a new algorithm-placed obstacle row in from the bottom and shifts
  // the whole board up by one row -- Tetris-style rising pressure. If the
  // topmost row is already occupied, there's nowhere for the shift to go:
  // the stack has reached the top and that's game over.
  function injectGarbageRow(){
    if (!CONFIG.enableRisingBoard) return;
    var topRowOccupied = board[0].some(function(v){ return !!v; });
    if (topRowOccupied){
      triggerGameOver("Stack Reached the Top!", "The rising blocks filled the board.");
      return;
    }
    for (var r=0; r<SIZE-1; r++) board[r] = board[r+1];
    board[SIZE-1] = buildGarbageRow();
    renderBoardStatic();
  }

  function buildGarbageRow(){
    var row = [];
    for (var c=0;c<SIZE;c++) row.push(Math.random() < CONFIG.garbageFillDensity ? "stone" : null);
    var openCount = row.filter(function(v){ return !v; }).length;
    while (openCount < CONFIG.garbageMinGaps){
      var idx = Math.floor(Math.random() * SIZE);
      if (row[idx]){ row[idx] = null; openCount++; }
    }
    return row;
  }

  function advanceRiseCounter(){
    if (!CONFIG.enableRisingBoard) return;
    movesSinceGarbage++;
    if (movesSinceGarbage >= CONFIG.garbageEveryMoves){
      movesSinceGarbage = 0;
      injectGarbageRow();
    }
  }

  function placeShape(shape, r0, c0){
    shape.cells.forEach(function(off){
      var r = r0+off[0], c = c0+off[1];
      board[r][c] = shape.wood;
    });
    score += shape.cells.length;
    var cleared = clearLines();
    if (cleared > 0){
      combo++;
      var bonus = cleared * CONFIG.comboBaseBonus * combo;
      score += bonus;
      flashCombo(cleared, combo);
    } else {
      combo = 0;
    }
    if (score > best){ best = score; saveBest(best); }
    updateHUD();
  }

  function clearLines(){
    var fullRows = [];
    var fullCols = [];
    for (var r=0;r<SIZE;r++){
      var full = true;
      for (var c=0;c<SIZE;c++) if (!board[r][c]) { full=false; break; }
      if (full) fullRows.push(r);
    }
    for (var c2=0;c2<SIZE;c2++){
      var full2 = true;
      for (var r2=0;r2<SIZE;r2++) if (!board[r2][c2]) { full2=false; break; }
      if (full2) fullCols.push(c2);
    }
    var toClear = [];
    fullRows.forEach(function(r){ for (var c=0;c<SIZE;c++) toClear.push([r,c]); });
    fullCols.forEach(function(c){ for (var r=0;r<SIZE;r++) toClear.push([r,c]); });
    if (toClear.length === 0) return 0;

    toClear.forEach(function(rc){
      var el = cellEls[rc[0]][rc[1]];
      el.classList.add("clearing");
    });
    setTimeout(function(){
      toClear.forEach(function(rc){
        board[rc[0]][rc[1]] = null;
        var el = cellEls[rc[0]][rc[1]];
        el.classList.remove("clearing","filled");
        el.innerHTML = "";
      });
    }, 260);

    return fullRows.length + fullCols.length;
  }

  function flashCombo(lines, comboCount){
    if (!CONFIG.enableComboFlash) return;
    var text = lines > 1 ? (lines + "x Clear!") : "Clear!";
    if (comboCount > 1) text += "  x" + comboCount + " combo";
    comboFlashEl.textContent = text;
    comboFlashEl.classList.remove("show");
    void comboFlashEl.offsetWidth;
    comboFlashEl.classList.add("show");
  }

  function updateHUD(){
    scoreEl.textContent = score;
    bestEl.textContent = best;
    if (riseInEl){
      riseInEl.textContent = CONFIG.enableRisingBoard
        ? Math.max(0, CONFIG.garbageEveryMoves - movesSinceGarbage)
        : "—";
    }
  }

  function renderBoardStatic(){
    for (var r=0;r<SIZE;r++){
      for (var c=0;c<SIZE;c++){
        var el = cellEls[r][c];
        var val = board[r][c];
        if (val){
          el.classList.add("filled");
          if (!el.firstChild){
            var b = document.createElement("div");
            b.className = "block wood-" + val;
            el.appendChild(b);
          } else {
            el.firstChild.className = "block wood-" + val;
          }
        } else if (!el.classList.contains("clearing")) {
          el.classList.remove("filled");
          el.innerHTML = "";
        }
      }
    }
  }

  // ---------- Tray rendering + drag/drop ----------
  var slots = Array.prototype.slice.call(document.querySelectorAll(".piece-slot"));
  var dragCtx = null;

  function pieceCellPx(){
    var wrap = document.getElementById("board-wrap");
    var boardRect = wrap.getBoundingClientRect();
    return (boardRect.width - 16 - (SIZE-1)*4) / SIZE;
  }

  // Builds a piece's visual at an explicit pixel scale. Used both for the
  // small tray display and for the full board-scale drag ghost -- keeping
  // these as two different scales was the source of an earlier placement bug
  // (dragging used the tray's shrunken size to compute board coordinates).
  //
  // IMPORTANT: only the shape's actual filled cells get a DOM element at
  // all, each absolutely positioned by its own offset. An earlier version
  // built a full grid.template rectangle (bounding box) and left "empty"
  // divs unstyled to represent gaps -- at small tray size those invisible
  // placeholders were easy to misread as part of the piece, making an L/S/T
  // shape look like a solid rectangle until it landed on the board at full
  // size. With no element at all for empty cells, there's nothing there to
  // misread.
  function buildPieceCells(shape, cellPx, gapPx){
    var maxR = Math.max.apply(null, shape.cells.map(function(c){return c[0];})) + 1;
    var maxC = Math.max.apply(null, shape.cells.map(function(c){return c[1];})) + 1;
    var w = maxC*cellPx + (maxC-1)*gapPx;
    var h = maxR*cellPx + (maxR-1)*gapPx;
    var el = document.createElement("div");
    el.className = "piece";
    el.style.width = w + "px";
    el.style.height = h + "px";
    shape.cells.forEach(function(off){
      var cellDiv = document.createElement("div");
      cellDiv.className = "pc block wood-" + shape.wood;
      cellDiv.style.position = "absolute";
      cellDiv.style.left = (off[1] * (cellPx + gapPx)) + "px";
      cellDiv.style.top = (off[0] * (cellPx + gapPx)) + "px";
      cellDiv.style.width = cellPx + "px";
      cellDiv.style.height = cellPx + "px";
      el.appendChild(cellDiv);
    });
    return { el: el, width: w, height: h };
  }

  function renderTray(){
    slots.forEach(function(slot, idx){
      slot.innerHTML = "";
      var shape = tray[idx];
      if (!shape) return;
      var trayCellPx = Math.min(26, pieceCellPx()*0.62);
      var built = buildPieceCells(shape, trayCellPx, 3);
      var pieceEl = built.el;
      pieceEl.style.left = (slot.clientWidth/2 - built.width/2) + "px";
      pieceEl.style.top = (slot.clientHeight/2 - built.height/2) + "px";
      pieceEl.dataset.slot = idx;
      if (!anyPlacement(shape)) pieceEl.classList.add("disabled");
      slot.appendChild(pieceEl);
      attachDrag(pieceEl, shape, idx);
    });
  }

  function attachDrag(pieceEl, shape, slotIdx){
    pieceEl.addEventListener("pointerdown", function(ev){
      if (gameOver || pieceEl.classList.contains("disabled")) return;
      ev.preventDefault();
      // Build a full board-scale ghost to drag -- this MUST match the
      // board's real cell pitch (pieceCellPx() + 4px gap) so the cell the
      // player sees under their finger is the same cell the math targets.
      var boardCellPx = pieceCellPx();
      var gapPx = 4;
      var built = buildPieceCells(shape, boardCellPx, gapPx);
      var ghost = built.el;
      ghost.classList.add("dragging");
      ghost.style.position = "fixed";
      document.body.appendChild(ghost);
      var liftPx = 64; // fixed vertical lift so the piece clears a finger/thumb
      dragCtx = {
        shape: shape, slotIdx: slotIdx, cellPx: boardCellPx, gapPx: gapPx,
        el: ghost, trayEl: pieceEl,
        offsetX: built.width/2,
        offsetY: built.height/2 + liftPx
      };
      pieceEl.style.visibility = "hidden";
      movePieceTo(ev.clientX, ev.clientY);
      updatePreview(ev.clientX, ev.clientY);
      ghost.setPointerCapture(ev.pointerId);
      ghost.addEventListener("pointermove", function(mv){
        if (!dragCtx || dragCtx.el !== ghost) return;
        movePieceTo(mv.clientX, mv.clientY);
        updatePreview(mv.clientX, mv.clientY);
      });
      ghost.addEventListener("pointerup", function(up){
        if (!dragCtx || dragCtx.el !== ghost) return;
        dropPiece(up.clientX, up.clientY);
      });
      ghost.addEventListener("pointercancel", function(){
        if (!dragCtx || dragCtx.el !== ghost) return;
        cancelDrag();
      });
    });
  }

  function movePieceTo(x,y){
    var d = dragCtx;
    d.el.style.left = (x - d.offsetX) + "px";
    d.el.style.top = (y - d.offsetY) + "px";
  }

  function targetCellFromPoint(x,y){
    var d = dragCtx;
    var anchorX = x - d.offsetX;
    var anchorY = y - d.offsetY;
    var boardRect = boardEl.getBoundingClientRect();
    var col0 = Math.round((anchorX - boardRect.left) / (d.cellPx + d.gapPx));
    var row0 = Math.round((anchorY - boardRect.top) / (d.cellPx + d.gapPx));
    return { r0: row0, c0: col0 };
  }

  function clearPreview(){
    for (var r=0;r<SIZE;r++) for (var c=0;c<SIZE;c++){
      cellEls[r][c].classList.remove("preview-ok","preview-bad");
    }
  }

  function updatePreview(x,y){
    clearPreview();
    var t = targetCellFromPoint(x,y);
    var ok = canPlace(dragCtx.shape, t.r0, t.c0);
    dragCtx.shape.cells.forEach(function(off){
      var r = t.r0+off[0], c = t.c0+off[1];
      if (r>=0&&r<SIZE&&c>=0&&c<SIZE){
        cellEls[r][c].classList.add(ok ? "preview-ok" : "preview-bad");
      }
    });
    dragCtx.lastTarget = t;
    dragCtx.lastOk = ok;
  }

  function removeGhost(){
    if (dragCtx && dragCtx.el && dragCtx.el.parentNode){
      dragCtx.el.parentNode.removeChild(dragCtx.el);
    }
  }

  function cancelDrag(){
    clearPreview();
    removeGhost();
    dragCtx = null;
    renderTray();
  }

  function dropPiece(x,y){
    var t = targetCellFromPoint(x,y);
    var ok = canPlace(dragCtx.shape, t.r0, t.c0);
    var slotIdx = dragCtx.slotIdx;
    clearPreview();
    removeGhost();
    if (ok){
      placeShape(dragCtx.shape, t.r0, t.c0);
      renderBoardStatic();
      tray[slotIdx] = null;
      dragCtx = null;
      renderTray();
      if (!gameOver) advanceRiseCounter();
      updateHUD();
      if (!gameOver){
        if (tray.every(function(s){return !s;})) refillTray();
        else checkGameOver();
      }
    } else {
      dragCtx = null;
      renderTray();
    }
  }

  window.addEventListener("resize", renderTray);

  // ---------- Remote config hook (used by hotfix loader) ----------
  window.applyRemoteConfig = function(cfg){
    if (!cfg || typeof cfg !== "object") return;
    if (typeof cfg.bannerText === "string") {
      CONFIG.bannerText = cfg.bannerText;
      bannerEl.textContent = cfg.bannerText;
    }
    if (typeof cfg.comboBaseBonus === "number") CONFIG.comboBaseBonus = cfg.comboBaseBonus;
    if (cfg.shapeWeights && typeof cfg.shapeWeights === "object") CONFIG.shapeWeights = cfg.shapeWeights;
    if (typeof cfg.enableComboFlash === "boolean") CONFIG.enableComboFlash = cfg.enableComboFlash;
    if (typeof cfg.enableRisingBoard === "boolean") CONFIG.enableRisingBoard = cfg.enableRisingBoard;
    if (typeof cfg.garbageEveryMoves === "number") CONFIG.garbageEveryMoves = cfg.garbageEveryMoves;
    if (typeof cfg.garbageFillDensity === "number") CONFIG.garbageFillDensity = cfg.garbageFillDensity;
    if (typeof cfg.garbageMinGaps === "number") CONFIG.garbageMinGaps = cfg.garbageMinGaps;
    updateHUD();
  };

  window.addEventListener("message", function(ev){
    if (ev && ev.data && ev.data.type === "kb-remote-config") {
      window.applyRemoteConfig(ev.data.config);
    }
  });

  // Apply any config cached from a previous hotfix check (works when this file
  // is loaded directly, same-origin, e.g. inside the packaged app).
  try {
    var cachedCfg = localStorage.getItem("kb_remoteConfig");
    if (cachedCfg) window.applyRemoteConfig(JSON.parse(cachedCfg));
  } catch(e){}

  document.getElementById("restart-btn").addEventListener("click", function(){
    overlayEl.classList.remove("show");
    score = 0; combo = 0; gameOver = false;
    movesSinceGarbage = 0;
    tray = [null,null,null];
    resetBoard();
    updateHUD();
    refillTray();
  });

  // ---------- Boot ----------
  best = loadBest();
  updateHUD();
  resetBoard();
  refillTray();

})();
</script>
</body>
</html>
